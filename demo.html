<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<title>扫码点餐</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#222;max-width:480px;margin:0 auto;min-height:100vh}
.header{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;padding:1.2rem 1rem;text-align:center;position:sticky;top:0;z-index:10}
.header h2{font-size:1.1rem;font-weight:600}
.header .table{font-size:.75rem;opacity:.75;margin-top:.2rem}
.cats{display:flex;gap:.5rem;padding:.8rem 1rem;overflow-x:auto;background:#fff;position:sticky;top:80px;z-index:5;border-bottom:1px solid #eee}
.cat{padding:.35rem .8rem;border-radius:20px;font-size:.78rem;white-space:nowrap;border:1px solid #ddd;background:#fff;cursor:pointer;transition:all .2s;flex-shrink:0}
.cat.on{background:#e74c3c;color:#fff;border-color:#e74c3c}
.menu{padding:.8rem 1rem 80px}
.item{display:flex;gap:.8rem;padding:.8rem;background:#fff;border-radius:10px;margin-bottom:.6rem;align-items:center;cursor:pointer}
.item:active{background:#f9f9f9}
.item .img{width:70px;height:70px;border-radius:8px;background:#f0f0f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:2rem}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600;font-size:.92rem;margin-bottom:.15rem}
.item .desc{font-size:.72rem;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .price{color:#e74c3c;font-weight:700;font-size:.9rem;margin-top:.3rem}
.item .add{width:28px;height:28px;border-radius:50%;background:#e74c3c;color:#fff;border:none;font-size:1.2rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
.item .add:active{transform:scale(.9)}
/* Cart Bar */
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#222;color:#fff;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;z-index:20;cursor:pointer}
.cart-bar .left{display:flex;align-items:center;gap:.6rem}
.cart-bar .badge{background:#e74c3c;color:#fff;font-size:.7rem;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 5px}
.cart-bar .total{font-weight:700;font-size:1rem}
.cart-bar .btn{background:#e74c3c;color:#fff;border:none;padding:.45rem 1.2rem;border-radius:6px;font-weight:600;cursor:pointer;font-size:.85rem}
/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none}
.overlay.on{display:block}
/* Bottom Sheet */
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;max-height:85vh;background:#fff;border-radius:20px 20px 0 0;z-index:30;transition:transform .3s ease-out;display:flex;flex-direction:column}
.sheet.on{transform:translateX(-50%) translateY(0)}
.sheet-header{display:flex;justify-content:space-between;align-items:flex-start;padding:1.2rem 1.2rem .6rem}
.sheet-header h3{font-size:1.05rem;font-weight:700;line-height:1.4;flex:1;padding-right:.5rem}
.sheet-header .close{width:28px;height:28px;border-radius:50%;background:#f5f5f5;border:none;font-size:1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#999}
.sheet-body{flex:1;overflow-y:auto;padding:0 1.2rem 100px}
.section{margin-bottom:1.3rem}
.section-label{font-size:.78rem;color:#999;margin-bottom:.5rem;font-weight:500}
.option-row{display:flex;flex-wrap:wrap;gap:.45rem}
.opt{padding:.45rem 1rem;border-radius:20px;font-size:.82rem;cursor:pointer;transition:all .15s;border:1.5px solid #eee;background:#f8f8f8;color:#555;user-select:none}
.opt.on{border-color:#e67e22;background:#fff;color:#e67e22;font-weight:600}
.tip-box{margin-top:.6rem;padding:.5rem .7rem;background:#fff8f0;border-radius:8px;font-size:.72rem;color:#e67e22;border:1px solid #ffe0c0}
.sheet-footer{position:absolute;bottom:0;left:0;right:0;padding:.8rem 1.2rem;padding-bottom:max(.8rem,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;z-index:5}
.sheet-footer .price-info{display:flex;flex-direction:column}
.sheet-footer .price{font-size:1.3rem;font-weight:800;color:#e74c3c}
.sheet-footer .orig{font-size:.72rem;color:#bbb;text-decoration:line-through}
.sheet-footer .add-btn{padding:.7rem 2rem;background:#f5a623;color:#fff;border:none;border-radius:24px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .15s}
.sheet-footer .add-btn:active{background:#e6951a}
/* Cart Panel */
.cart-panel{position:fixed;top:0;right:-100%;width:100%;max-width:480px;height:100vh;background:#fff;z-index:30;transition:right .3s;display:flex;flex-direction:column}
.cart-panel.on{right:0}
.cart-panel .cph{padding:1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.cart-panel .cph h3{font-size:1rem}
.cart-panel .cph button{background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999}
.cart-list{flex:1;overflow-y:auto;padding:1rem}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid #f5f5f5;font-size:.88rem}
.cart-item .ci-left{flex:1}
.cart-item .ci-name{font-weight:600}
.cart-item .ci-opts{font-size:.72rem;color:#e67e22;margin-top:.15rem}
.cart-item .qty{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.cart-item .qty button{width:24px;height:24px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.cart-item .ci-price{font-weight:700;color:#e74c3c;margin-left:.8rem;font-size:.85rem}
.cart-empty{text-align:center;color:#999;padding:3rem 0;font-size:.9rem}
.cart-footer{padding:1rem;padding-bottom:max(1rem,env(safe-area-inset-bottom));border-top:1px solid #eee}
.cart-footer .row{display:flex;justify-content:space-between;margin-bottom:.4rem;font-size:.85rem}
.cart-footer .row.total{font-weight:700;font-size:1.05rem;margin-top:.4rem;padding-top:.4rem;border-top:1px solid #eee}
.cart-footer .checkout{width:100%;padding:.75rem;background:#e74c3c;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.6rem}
.cart-footer .checkout:active{background:#c0392b}
/* Pay Modal */
.pay-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:2rem 1.5rem;z-index:35;text-align:center;display:none;width:90%;max-width:360px}
.pay-modal.on{display:block}
.pay-modal h3{font-size:1.1rem;margin-bottom:.5rem}
.pay-modal .amount{font-size:1.8rem;font-weight:800;color:#e74c3c;margin:.8rem 0}
.pay-modal .qr-img{max-width:250px;margin:.6rem auto;border-radius:12px;overflow:hidden}
.pay-modal .qr-img img{width:100%;display:block}
.pay-modal .hint{font-size:.78rem;color:#e74c3c;font-weight:600;margin:.4rem 0}
.pay-modal .subhint{font-size:.75rem;color:#999;margin-bottom:.8rem}
.pay-done{width:100%;padding:.75rem;background:#07c160;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.pay-done:active{background:#06ad56}
</style>
</head>
<body>

<div class="header"><h2>🍜 大嘴食肆 <span onclick="event.stopPropagation();toggleAdmin()" style="font-size:.7rem;opacity:.6;cursor:pointer;margin-left:.3rem">⚙</span></h2><div class="table">桌号 A05 · 扫码点餐</div></div>
<div class="cats" id="cats">
  <span class="cat on" data-cat="all">全部</span><span class="cat" data-cat="hot">🔥 热菜</span><span class="cat" data-cat="cold">🥒 凉菜</span><span class="cat" data-cat="staple">🍚 主食</span><span class="cat" data-cat="drink">🥤 饮品</span>
</div>
<div class="menu" id="menu"></div>

<div class="cart-bar" id="cartBar">
  <div class="left"><span>🛒</span><span class="badge" id="cartCount">0</span></div>
  <span class="total" id="cartTotal">¥0.00</span><span class="btn">去结算</span>
</div>

<!-- Bottom Sheet -->
<div class="overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-header">
    <h3 id="sheetTitle"></h3>
    <button class="close" id="sheetClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="section">
      <div class="section-label">份量</div>
      <div class="option-row" id="sizeOpts"></div>
    </div>
    <div class="section">
      <div class="section-label">辣度</div>
      <div class="option-row" id="spiceOpts"></div>
    </div>
    <div class="section">
      <div class="section-label">忌口/备注</div>
      <div class="option-row" id="dietOpts"></div>
      <div class="tip-box">⚠ 特殊忌口请在下方备注，以免上错餐</div>
    </div>
    <div class="section">
      <textarea id="noteInput" placeholder="其他备注（选填），如：多放醋、不要姜" style="width:100%;padding:.6rem .7rem;border:1.5px solid #eee;border-radius:10px;font-size:.82rem;font-family:inherit;resize:none;height:50px"></textarea>
    </div>
  </div>
  <div class="sheet-footer">
    <div class="price-info"><span class="price" id="sheetPrice">¥0</span><span class="orig" id="sheetOrig"></span></div>
    <button class="add-btn" id="sheetAddBtn">加入购物车</button>
  </div>
</div>

<!-- Cart Panel -->
<div class="overlay" id="cartOverlay"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cph"><h3>已点菜品</h3><button id="cartClose">✕</button></div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-footer" id="cartFooter"></div>
</div>

<!-- Pay Modal -->
<div class="pay-modal" id="payModal">
  <h3>💳 微信支付</h3>
  <div class="amount" id="payAmount">¥0.00</div>
  <div class="qr-img"><img src="https://liguanhao1.github.io/dazui-order/qr-pay.png" alt="收款码"></div>
  <p class="hint">👆 长按上方二维码 → 识别图中二维码</p>
  <p class="subhint">输入上方金额付款，付完点下方按钮</p>
  <button class="pay-done" onclick="payDone()">✅ 已付款，通知后厨</button>
</div>

<script>
// ====== 菜单数据 ======
// 改菜品：直接改下面数组
// 加图片：img 填图片地址（本地文件放同级目录，比如 "images/gongbao.jpg"）
//         不填 img 就用 icon emoji 占位
const menuData = [
  { id:1, cat:"hot", name:"宫保鸡丁", desc:"鸡胸肉丁+花生米，麻辣鲜香", price:32, icon:"🍗" },
  { id:2, cat:"hot", name:"鱼香肉丝", desc:"猪肉丝+木耳+笋丝，酸甜微辣", price:28, icon:"🥩" },
  { id:3, cat:"hot", name:"麻婆豆腐", desc:"嫩豆腐+牛肉末，麻辣烫口", price:22, icon:"🧈" },
  { id:4, cat:"hot", name:"回锅肉",   desc:"二刀肉+蒜苗+豆瓣酱，肥而不腻", price:30, icon:"🥓" },
  { id:5, cat:"hot", name:"水煮鱼",   desc:"草鱼片+豆芽+干辣椒，麻辣鲜嫩", price:58, icon:"🐟" },
  { id:6, cat:"hot", name:"辣子鸡",   desc:"鸡块+干辣椒+花椒，外酥里嫩", price:36, icon:"🍖" },
  { id:7, cat:"cold",name:"蒜泥白肉", desc:"猪后腿肉+蒜泥+辣椒油", price:26, icon:"🥢" },
  { id:8, cat:"cold",name:"凉拌黄瓜", desc:"新鲜黄瓜+蒜末+醋汁", price:12, icon:"🥒" },
  { id:9, cat:"cold",name:"口水鸡",   desc:"鸡腿肉+花生碎+红油料汁", price:28, icon:"🍗" },
  { id:10,cat:"cold",name:"皮蛋豆腐", desc:"内酯豆腐+松花蛋+酱油汁", price:16, icon:"🥚" },
  { id:11,cat:"staple",name:"蛋炒饭", desc:"鸡蛋+火腿丁+葱花", price:12, icon:"🍳" },
  { id:12,cat:"staple",name:"担担面", desc:"肉末+花生碎+芝麻酱，麻辣味", price:14, icon:"🍝" },
  { id:13,cat:"staple",name:"白米饭", desc:"东北珍珠大米", price:2,  icon:"🍚" },
  { id:17,cat:"staple",name:"酸辣粉", desc:"红薯粉+花生碎+酸辣汤底，够味", price:12, icon:"🍲" },
  { id:18,cat:"staple",name:"云吞面", desc:"鲜虾云吞+细面+高汤，广东味道", price:15, icon:"🍜" },
  { id:14,cat:"drink",name:"王老吉",  desc:"罐装 310ml", price:6,  icon:"🥫" },
  { id:15,cat:"drink",name:"酸梅汤",  desc:"自制冰镇酸梅汤 500ml", price:8,  icon:"🥤" },
  { id:16,cat:"drink",name:"雪花啤酒",desc:"瓶装 500ml", price:8,  icon:"🍺" },
  // 加图片示例（取消下面注释，替换为真实图片地址）：
  // { id:19,cat:"hot",name:"红烧牛肉",desc:"牛腩+土豆，慢炖入味",price:42,icon:"🥩",img:"images/beef.jpg" },
];
let cart = [], activeCat = "all", curItem = null;
const sizes = ["大碗","中碗","小碗"], spices = ["微辣","中辣","特辣","免辣"];
const dietOpts = ["不吃香菜","不吃葱花","不吃蒜","少油","少盐"];
let sel = { size:"大碗", spice:"微辣", diet:[], note:"" };

// ====== 本地存储 ======
function loadMenu(){ try{ const d=localStorage.getItem("dazui_menu"); return d?JSON.parse(d):null; }catch(e){return null;} }
function saveMenu(){ localStorage.setItem("dazui_menu",JSON.stringify(menuData)); }
(function(){ const saved=loadMenu(); if(saved&&saved.length)menuData.length=0,menuData.push(...saved); })();

function renderMenu(filter){
  const m = document.getElementById("menu"), items = filter==="all"?menuData:menuData.filter(i=>i.cat===filter);
  m.innerHTML = items.map(i=>`
    <div class="item" onclick="openSheet(${i.id})">
      <div class="img">${i.img ? `<img src="${i.img}" alt="${i.name}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" onerror="this.style.display='none';this.parentElement.textContent='${i.icon}'">` : i.icon}</div>
      <div class="info"><div class="name">${i.name}</div><div class="desc">${i.desc}</div><div class="price">¥${i.price}</div></div>
      <button class="add" onclick="event.stopPropagation();openSheet(${i.id})">+</button>
    </div>`).join("");
}

function openSheet(id){
  curItem = menuData.find(i=>i.id===id); if(!curItem)return;
  sel = { size:"大碗", spice:"微辣", diet:[], note:"" };
  document.getElementById("sheetTitle").textContent = curItem.name + "【堂食】";
  document.getElementById("sheetPrice").textContent = "¥"+curItem.price;
  document.getElementById("sheetOrig").textContent = "";
  document.getElementById("noteInput").value = "";
  document.getElementById("sizeOpts").innerHTML = sizes.map(s=>`<span class="opt${s===sel.size?' on':''}" onclick="pick('size','${s}')">${s}</span>`).join("");
  document.getElementById("spiceOpts").innerHTML = spices.map(s=>`<span class="opt${s===sel.spice?' on':''}" onclick="pick('spice','${s}')">${s}</span>`).join("");
  document.getElementById("dietOpts").innerHTML = dietOpts.map(d=>`<span class="opt${sel.diet.includes(d)?' on':''}" onclick="toggleDiet('${d}')">${d}</span>`).join("");
  document.getElementById("sheet").classList.add("on");
  document.getElementById("sheetOverlay").classList.add("on");
}

function pick(key,val){ sel[key]=val; openSheet(curItem.id); }
function toggleDiet(d){
  sel.diet.includes(d) ? sel.diet=sel.diet.filter(x=>x!==d) : sel.diet.push(d);
  openSheet(curItem.id);
}

function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("sheetOverlay").classList.remove("on");
}

document.getElementById("sheetOverlay").addEventListener("click",closeSheet);
document.getElementById("sheetClose").addEventListener("click",closeSheet);

document.getElementById("sheetAddBtn").addEventListener("click",()=>{
  const opts = [sel.size];
  sel.diet.forEach(d=>opts.push(d));
  if(sel.spice!=="微辣") opts.push(sel.spice);
  const note = document.getElementById("noteInput").value.trim();
  if(note) opts.push(note);
  cart.push({...curItem, qty:1, opts:opts.join(" · ")});
  closeSheet();
  updateCart();
});

function removeItem(idx){
  cart.splice(idx,1);
  updateCart();
}
function incItem(idx){ cart[idx].qty++; updateCart(); }
function decItem(idx){ cart[idx].qty--; if(cart[idx].qty<=0) cart.splice(idx,1); updateCart(); }

function updateCart(){
  const count = cart.reduce((s,c)=>s+c.qty,0), total = cart.reduce((s,c)=>s+c.qty*c.price,0);
  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent = "¥"+total.toFixed(2);
  renderCartPanel();
}

function renderCartPanel(){
  const list = document.getElementById("cartList"), footer = document.getElementById("cartFooter");
  if(cart.length===0){ list.innerHTML='<div class="cart-empty">🛒 还没有点菜，去菜单里加吧</div>'; footer.innerHTML=""; return; }
  list.innerHTML = cart.map((c,i)=>`
    <div class="cart-item">
      <div class="ci-left"><div class="ci-name">${c.name}</div><div class="ci-opts">${c.opts}</div></div>
      <div class="qty"><button onclick="decItem(${i})">−</button><span>${c.qty}</span><button onclick="incItem(${i})">+</button></div>
      <span class="ci-price">¥${(c.price*c.qty).toFixed(0)}</span>
    </div>`).join("");
  const total = cart.reduce((s,c)=>s+c.qty*c.price,0);
  footer.innerHTML = `
    <div class="row"><span>菜品合计</span><span>¥${total.toFixed(2)}</span></div>
    <div class="row total"><span>应付</span><span style="color:#e74c3c">¥${total.toFixed(2)}</span></div>
    <button class="checkout" onclick="checkout()">确认下单</button>
  `;
}

function checkout(){
  const total = cart.reduce((s,c)=>s+c.qty*c.price,0);
  document.getElementById("payAmount").textContent = "¥"+total.toFixed(2);
  document.getElementById("payModal").classList.add("on");
  document.getElementById("cartOverlay").classList.add("on");
  document.getElementById("cartPanel").classList.remove("on");
}

function payDone(){
  const items = cart.map(c=>`${c.name}×${c.qty}（${c.opts}）`).join("、");
  const total = cart.reduce((s,c)=>s+c.qty*c.price,0);
  alert(`✅ 下单成功！\n\n${items}\n\n共 ¥${total.toFixed(2)}\n\n后厨正在制作，请稍候…`);
  cart=[];updateCart();
  document.getElementById("payModal").classList.remove("on");
  document.getElementById("cartOverlay").classList.remove("on");
}

document.getElementById("cartBar").addEventListener("click",()=>{
  document.getElementById("cartPanel").classList.add("on");
  document.getElementById("cartOverlay").classList.add("on");
});
document.getElementById("cartClose").addEventListener("click",()=>{
  document.getElementById("cartPanel").classList.remove("on");
  document.getElementById("cartOverlay").classList.remove("on");
});
document.getElementById("cartOverlay").addEventListener("click",()=>{
  document.getElementById("cartPanel").classList.remove("on");
  document.getElementById("cartOverlay").classList.remove("on");
});
document.getElementById("cats").addEventListener("click",e=>{
  if(!e.target.classList.contains("cat"))return;
  document.querySelectorAll(".cat").forEach(c=>c.classList.remove("on"));
  e.target.classList.add("on");activeCat=e.target.dataset.cat;renderMenu(activeCat);
});

renderMenu("all");updateCart();

// ====== 管理后台 ======
let adminOn = false;
const adminHTML = `
<div id="adminPanel" style="display:none;position:fixed;inset:0;z-index:100;background:#fff;overflow-y:auto;padding-bottom:80px">
  <div style="background:#1a1a2e;color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5">
    <b>🔧 菜单管理</b><button onclick="toggleAdmin()" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer">✕</button>
  </div>
  <div style="padding:1rem">
    <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
      <select id="admCat" style="padding:.4rem .6rem;border:1px solid #ddd;border-radius:6px;font-size:.85rem">
        <option value="hot">🔥 热菜</option><option value="cold">🥒 凉菜</option><option value="staple">🍚 主食</option><option value="drink">🥤 饮品</option>
      </select>
      <input id="admName" placeholder="菜名" style="flex:1;min-width:80px;padding:.4rem;border:1px solid #ddd;border-radius:6px;font-size:.85rem">
      <input id="admPrice" placeholder="价格" type="number" style="width:70px;padding:.4rem;border:1px solid #ddd;border-radius:6px;font-size:.85rem">
    </div>
    <div style="display:flex;gap:.5rem;margin-bottom:1rem">
      <input id="admDesc" placeholder="描述（选填）" style="flex:1;padding:.4rem;border:1px solid #ddd;border-radius:6px;font-size:.85rem">
      <input id="admImg" placeholder="图片地址（选填）" style="flex:1;padding:.4rem;border:1px solid #ddd;border-radius:6px;font-size:.85rem">
    </div>
    <button onclick="addMenuItem()" style="width:100%;padding:.6rem;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:1.5rem">➕ 添加菜品</button>
    <div id="admList" style="font-size:.85rem"></div>
  </div>
</div>`;

document.body.insertAdjacentHTML("beforeend",adminHTML);

function toggleAdmin(){
  adminOn=!adminOn;
  document.getElementById("adminPanel").style.display=adminOn?"block":"none";
  if(adminOn) renderAdminList();
}
function renderAdminList(){
  const list=document.getElementById("admList");
  list.innerHTML=menuData.map((m,i)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem;border-bottom:1px solid #f0f0f0;gap:.5rem">
      <span style="flex:1"><b>${m.name}</b> <span style="color:#999;font-size:.75rem">${m.cat} ¥${m.price}</span> ${m.img?'🖼':''}</span>
      <button onclick="delMenuItem(${i},this)" style="background:#fee;color:#e74c3c;border:none;padding:.25rem .6rem;border-radius:4px;cursor:pointer;font-size:.75rem">删除</button>
    </div>`).join("")||'<div style="color:#999;text-align:center;padding:2rem">暂无菜品</div>';
}
function addMenuItem(){
  const name=document.getElementById("admName").value.trim(),price=Number(document.getElementById("admPrice").value);
  if(!name||!price)return alert("菜名和价格必填");
  const cat=document.getElementById("admCat").value,desc=document.getElementById("admDesc").value.trim();
  const img=document.getElementById("admImg").value.trim();
  const id=Math.max(0,...menuData.map(m=>m.id))+1;
  const emojis={hot:"🍖",cold:"🥒",staple:"🍚",drink:"🥤"};
  menuData.push({id,cat,name,desc:desc||name,price,icon:emojis[cat]||"🍽",img:img||null});
  saveMenu();renderAdminList();renderMenu(activeCat);
  document.getElementById("admName").value="";document.getElementById("admPrice").value="";document.getElementById("admDesc").value="";document.getElementById("admImg").value="";
}
function delMenuItem(i,btn){
  if(btn.dataset.confirm){
    menuData.splice(i,1);saveMenu();renderAdminList();renderMenu(activeCat);
    // 清理购物车中已删除的菜品
    cart=cart.filter(c=>menuData.some(m=>m.id===c.id));updateCart();
    return;
  }
  btn.dataset.confirm="1";btn.textContent="确认删除";btn.style.background="#e74c3c";btn.style.color="#fff";
  setTimeout(()=>{delete btn.dataset.confirm;btn.textContent="删除";btn.style.background="#fee";btn.style.color="#e74c3c"},3000);
}

// 长按店名3秒进入管理
let pressTimer;
document.querySelector(".header").addEventListener("touchstart",()=>{ pressTimer=setTimeout(toggleAdmin,2000); });
document.querySelector(".header").addEventListener("touchend",()=>clearTimeout(pressTimer));
document.querySelector(".header").addEventListener("touchmove",()=>clearTimeout(pressTimer));
// 桌面端双击进入
document.querySelector(".header").addEventListener("dblclick",toggleAdmin);
</script>
</body>
</html>
